<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>cpu.h as a blueprint: public buttons vs private gears</title>
<desc>The CPU struct has public functions that outside code may call, like reset, step, nmi, and irq, and private helper functions like push, pop, adc, and branch that only the CPU itself may use internally.</desc>

<rect x="0" y="0" width="680" height="280" fill="#ffffff"/>

<g>
  <rect x="40" y="30" width="600" height="220" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="60" y="55" font-size="14" font-weight="600" fill="#444441">cpu.h — the blueprint</text>
</g>

<g>
  <rect x="70" y="80" width="260" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="200" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Public buttons</text>
  <text x="200" y="122" text-anchor="middle" font-size="12" fill="#0F6E56">outside code may press these</text>
  <text x="90" y="150" font-size="12" fill="#0F6E56">reset(mem)</text>
  <text x="90" y="172" font-size="12" fill="#0F6E56">step(mem)</text>
  <text x="90" y="194" font-size="12" fill="#0F6E56">nmi(mem)</text>
  <text x="90" y="216" font-size="12" fill="#0F6E56">irq(mem)</text>
</g>

<g>
  <rect x="350" y="80" width="260" height="150" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="480" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Private gears</text>
  <text x="480" y="122" text-anchor="middle" font-size="12" fill="#993C1D">only the CPU may use these</text>
  <text x="370" y="150" font-size="12" fill="#993C1D">push(), pop()</text>
  <text x="370" y="172" font-size="12" fill="#993C1D">adc(), sbc()</text>
  <text x="370" y="194" font-size="12" fill="#993C1D">branch(), compare()</text>
  <text x="370" y="216" font-size="12" fill="#993C1D">operandAddress()</text>
</g>
</svg>
