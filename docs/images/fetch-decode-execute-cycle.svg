<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The fetch-decode-execute cycle</title>
<desc>Three steps in a loop: fetch an instruction byte, decode what it means, execute it, then repeat from fetch.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="260" fill="#ffffff"/>

<g>
  <rect x="50" y="60" width="160" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="130" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">1. Fetch</text>
  <text x="130" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Read next byte at PC</text>
</g>

<line x1="210" y1="88" x2="248" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="250" y="60" width="160" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="330" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">2. Decode</text>
  <text x="330" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Figure out the meaning</text>
</g>

<line x1="410" y1="88" x2="448" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="450" y="60" width="160" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="530" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">3. Execute</text>
  <text x="530" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Change A, X, Y, memory...</text>
</g>

<path d="M530 116 L530 190 L130 190 L130 116" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="330" y="210" text-anchor="middle" font-size="12" fill="#5F5E5A">repeats forever, millions of times per second</text>
</svg>
