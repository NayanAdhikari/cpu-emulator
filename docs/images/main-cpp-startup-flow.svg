<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>How main.cpp starts the emulator</title>
<desc>Sequence: create memory and CPU, load the program into memory, write the reset vector, call cpu.reset, then either run automatically or step through with the debugger.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="340" fill="#ffffff"/>

<g>
  <rect x="60" y="20" width="560" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">1. Create a blank Memory and a blank CPU</text>
</g>
<line x1="340" y1="64" x2="340" y2="94" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="60" y="96" width="560" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">2. Load the program's bytes into memory</text>
</g>
<line x1="340" y1="140" x2="340" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="60" y="172" width="560" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="194" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">3. Write the reset vector at $FFFC</text>
</g>
<line x1="340" y1="216" x2="340" y2="246" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="60" y="248" width="560" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="270" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">4. cpu.reset(mem) — power on, read PC from vector</text>
</g>

<line x1="240" y1="292" x2="150" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="292" x2="530" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="60" y="310" width="180" height="28" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="150" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">5a. runProgram — let it go</text>
</g>
<g>
  <rect x="440" y="310" width="180" height="28" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="530" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">5b. debugger — step by step</text>
</g>
</svg>
