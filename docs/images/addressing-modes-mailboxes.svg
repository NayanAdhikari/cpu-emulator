<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Addressing modes as mailboxes</title>
<desc>Different ways an instruction can point to where its data lives: immediate value in the recipe, zero page address, absolute address, indexed address shifted by a register, and indirect address pointing to another mailbox.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

<g>
  <rect x="40" y="30" width="600" height="240" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="60" y="52" font-size="14" font-weight="600" fill="#444441">Memory: a wall of numbered mailboxes</text>
</g>

<g>
  <rect x="60" y="80" width="150" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="135" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Immediate</text>
  <text x="135" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">"the value is 5"</text>
</g>

<g>
  <rect x="230" y="80" width="150" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="305" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Zero page</text>
  <text x="305" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">"look in box #20"</text>
</g>

<g>
  <rect x="400" y="80" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="475" y="98" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Absolute</text>
  <text x="475" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">"look in box #8192"</text>
</g>

<g>
  <rect x="145" y="170" width="180" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="235" y="188" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Indexed (,X / ,Y)</text>
  <text x="235" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">"box #20, shifted by X"</text>
</g>

<g>
  <rect x="360" y="170" width="180" height="50" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
  <text x="450" y="188" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#72243E">Indirect</text>
  <text x="450" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993556">"box #20 tells you the box"</text>
</g>

<text x="60" y="252" font-size="12" fill="#5F5E5A">Each style is just a different set of directions to the same wall of boxes.</text>
</svg>
